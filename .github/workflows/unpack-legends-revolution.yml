name: Install Legends Revolution screenshots

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/unpack-legends-revolution.yml

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract and verify screenshots
        run: |
          unzip -o legends-revolution/legends-revolution-images.zip -d .
          for file in 1.jpg 2.jpg 3.jpg 4.jpg 5.jpg 6.jpg; do
            test -s "legends-revolution/$file"
          done

      - name: Commit screenshots and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/unpack-legends-revolution.yml
          git add legends-revolution/1.jpg legends-revolution/2.jpg legends-revolution/3.jpg legends-revolution/4.jpg legends-revolution/5.jpg legends-revolution/6.jpg
          git commit -m "Add Legends Revolution screenshots"
          git push origin HEAD:main
